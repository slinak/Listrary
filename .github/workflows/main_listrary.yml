# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - listrary-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: listrary-app-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build ListManager.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ListManager.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5CBC2367D77F4E838257C4E9705855AD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_02EF648BEDC64E36999992526F494446 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_60EDFA2D49BF40B88EA772A0707E517E }}

      - name: Configure database connection string
        shell: pwsh
        env:
          LISTMANAGER_CONNECTION_STRING: ${{ secrets.LISTMANAGER_CONNECTION_STRING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LISTMANAGER_CONNECTION_STRING)) {
            throw "The LISTMANAGER_CONNECTION_STRING GitHub Actions secret is required."
          }

          az webapp config connection-string set `
            --resource-group ListraryServiceGroup `
            --name listrary-app `
            --connection-string-type SQLAzure `
            --settings "DefaultConnection=$env:LISTMANAGER_CONNECTION_STRING" `
            --output none

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'listrary-app'
          slot-name: 'Production'
          package: .
