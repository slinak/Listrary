name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build -c Release --no-restore
    
    - name: Run tests
      run: dotnet test -c Release --no-build --verbosity normal || true
    
    - name: Publish
      run: dotnet publish -c Release -o ./publish --no-build

  deploy:
    needs: build
    runs-on: self-hosted  # <-- Uses your local runner
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      APP_DIR: /opt/listmanager
      APP_USER: homer
      APP_GROUP: homer
      DB_DIR: /var/lib/listmanager
    
    steps:
    - uses: actions/checkout@v4
      with:
        clean: false

    - name: Ensure workspace ownership for runner
      run: |
        set -e
        if sudo -n /usr/bin/chown --version >/dev/null 2>&1; then
          sudo -n chown -R "$USER":"$USER" "$GITHUB_WORKSPACE" || true
        fi
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
    
    - name: Publish
      run: dotnet publish -c Release -o /tmp/listmanager-new

    - name: Validate deploy privileges
      run: |
        set -e
        if ! sudo -n /usr/bin/systemctl --version >/dev/null 2>&1; then
          echo "::error::Self-hosted runner user '$USER' does not have passwordless sudo."
          echo "::error::Configure /etc/sudoers.d/listmanager-runner with the required commands, for example:"
          echo "::error::${USER} ALL=(root) NOPASSWD: /usr/bin/mkdir, /usr/bin/chown, /usr/bin/chmod, /usr/bin/cp, /usr/bin/systemctl, /usr/bin/journalctl"
          echo "::error::Then run: sudo visudo -cf /etc/sudoers.d/listmanager-runner"
          exit 1
        fi
    
    - name: Deploy
      run: |
        set -e

        if ! sudo -n /usr/bin/systemctl --version >/dev/null 2>&1; then
          echo "Passwordless sudo is required for deployment commands on this runner."
          exit 1
        fi

        show_service_diagnostics() {
          echo "==== systemctl status listmanager (full) ===="
          sudo -n systemctl status listmanager --no-pager -l || true
          echo "==== journalctl -u listmanager (last 200 lines) ===="
          sudo -n journalctl -u listmanager --no-pager -n 200 || true
        }
        
        # Ensure app directory exists for first-time deployments.
        sudo -n mkdir -p "$APP_DIR"
        sudo -n mkdir -p "$DB_DIR"
        sudo -n chown -R "$APP_USER":"$APP_GROUP" "$DB_DIR"

        # Stop service
        sudo -n systemctl stop listmanager || true
        sudo -n systemctl reset-failed listmanager || true

        # The app does not emit sd_notify messages; force simple startup semantics.
        sudo -n mkdir -p /etc/systemd/system/listmanager.service.d
        override_tmp="$(mktemp)"
        printf "[Service]\nType=simple\n" > "$override_tmp"
        sudo -n cp "$override_tmp" /etc/systemd/system/listmanager.service.d/override.conf
        rm -f "$override_tmp"
        sudo -n systemctl daemon-reload || true
        
        # Backup current deployment when present.
        if [ -d "$APP_DIR" ]; then
          sudo -n cp -r "$APP_DIR" "$APP_DIR".backup.$(date +%s)
        fi
        
        # Deploy
        sudo -n cp -r /tmp/listmanager-new/* "$APP_DIR"/
        sudo -n chown -R "$APP_USER":"$APP_GROUP" "$APP_DIR"
        sudo -n chmod +x "$APP_DIR"/ListManager

        echo "==== systemctl cat listmanager ===="
        sudo -n systemctl cat listmanager || true
        
        # Start service
        if ! sudo -n systemctl start listmanager; then
          show_service_diagnostics
          exit 1
        fi
        sleep 2
        if ! sudo -n systemctl is-active --quiet listmanager; then
          show_service_diagnostics
          exit 1
        fi
        sudo -n systemctl status listmanager --no-pager -l
        
        # Cleanup
        rm -rf /tmp/listmanager-new