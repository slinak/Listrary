name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build -c Release --no-restore
    
    - name: Run tests
      run: dotnet test -c Release --no-build --verbosity normal || true
    
    - name: Publish
      run: dotnet publish -c Release -o ./publish --no-build

  deploy:
    needs: build
    runs-on: self-hosted  # <-- Uses your local runner
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      APP_DIR: /opt/listmanager
      APP_USER: homer
      APP_GROUP: homer
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Publish
      run: dotnet publish -c Release -o /tmp/listmanager-new
    
    - name: Deploy
      run: |
        set -e
        
        # Stop service
        sudo systemctl stop listmanager || true
        
        # Backup
        sudo cp -r "$APP_DIR" "$APP_DIR".backup.$(date +%s)
        
        # Deploy
        sudo cp -r /tmp/listmanager-new/* "$APP_DIR"/
        sudo chown -R "$APP_USER":"$APP_GROUP" "$APP_DIR"
        sudo chmod +x "$APP_DIR"/ListManager
        
        # Run migrations
        cd "$APP_DIR"
        dotnet ef database update --no-build 2>/dev/null || true
        
        # Start service
        sudo systemctl start listmanager
        sleep 2
        sudo systemctl status listmanager
        
        # Cleanup
        rm -rf /tmp/listmanager-new