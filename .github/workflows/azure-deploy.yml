name: Deploy to listrary-app

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: listrary-app-production
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: listrary-app
  DOTNET_VERSION: '8.0.x'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ListManager.csproj

      - name: Publish
        run: dotnet publish ListManager.csproj -c Release -o "${{ github.workspace }}/publish" --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ${{ github.workspace }}/publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ${{ github.workspace }}/publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5CBC2367D77F4E838257C4E9705855AD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_02EF648BEDC64E36999992526F494446 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_60EDFA2D49BF40B88EA772A0707E517E }}

      - name: Configure database connection string
        env:
          LISTMANAGER_CONNECTION_STRING: ${{ secrets.LISTMANAGER_CONNECTION_STRING }}
        run: |
          if [ -z "$LISTMANAGER_CONNECTION_STRING" ]; then
            echo "::error::The LISTMANAGER_CONNECTION_STRING GitHub Actions secret is required."
            exit 1
          fi

          az webapp config connection-string set \
            --resource-group ListraryServiceGroup \
            --name "$AZURE_WEBAPP_NAME" \
            --connection-string-type SQLAzure \
            --settings "DefaultConnection=$LISTMANAGER_CONNECTION_STRING" \
            --output none

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ github.workspace }}/publish
